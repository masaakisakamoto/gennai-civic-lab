[tool.pytest.ini_options]
pythonpath = [".", "packages/gennai_app_kit/src", "packages/gennai_evals/src", "packages/gennai_cli/src", "packages/gennai_local_runner/src", "packages/gennai_red_team_lite/src", "packages/gennai_observability/src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
