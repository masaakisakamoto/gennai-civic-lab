services:
  easy-japanese:
    build:
      context: ../..
    command: uvicorn apps.easy_japanese_rewriter.app:app --host 0.0.0.0 --port 8000
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - GENNAI_ENV=local

  faq-rag:
    build:
      context: ../..
    command: uvicorn apps.citizen_faq_rag.app:app --host 0.0.0.0 --port 8001
    ports:
      - "127.0.0.1:8001:8001"
    environment:
      - GENNAI_ENV=local
    volumes:
      - ../../reports:/app/reports

  local-runner:
    build:
      context: ../..
    command: uvicorn gennai_local_runner.app:app --host 0.0.0.0 --port 8010
    ports:
      - "127.0.0.1:8010:8010"
    environment:
      - GENNAI_ENV=local
    depends_on:
      - easy-japanese
      - faq-rag
