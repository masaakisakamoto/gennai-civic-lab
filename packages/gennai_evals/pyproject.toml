[project]
name = "gennai-evals"
version = "0.7.0"
description = "Tiny eval runner for Gennai-compatible civic AI apps"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6"]
readme = "README.md"
license = {text = "MIT"}

[project.scripts]
gennai-evals = "gennai_evals.runner:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
