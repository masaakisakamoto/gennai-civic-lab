name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e packages/gennai_app_kit
          pip install -e packages/gennai_evals
          pip install -e packages/gennai_cli
          pip install -e packages/gennai_local_runner
          pip install -e packages/gennai_red_team_lite
          pip install -e packages/gennai_observability
          pip install pytest pyyaml jsonschema fastapi uvicorn
      - name: Unit tests
        run: pytest -q
      - name: Validate manifests
        run: python scripts/validate_manifests.py
      - name: Eval smoke tests
        run: |
          python packages/gennai_evals/src/gennai_evals/runner.py evals/easy_japanese.yaml
          python packages/gennai_evals/src/gennai_evals/runner.py evals/citizen_faq.yaml
      - name: Red-team smoke tests
        run: python packages/gennai_red_team_lite/src/gennai_red_team_lite/runner.py evals/red_team.yaml
      - name: Eval report
        run: python packages/gennai_evals/src/gennai_evals/runner.py --markdown-report reports/eval-report.md --json-report reports/eval-report.json evals/easy_japanese.yaml evals/citizen_faq.yaml
      - name: FAQ import smoke test
        run: python scripts/import_faq_corpus.py --input examples/faq_sample.csv --output /tmp/imported_faq.md --title "Imported Demo FAQ"
      - name: Operational report
        run: |
          python scripts/generate_demo_traces.py --output reports/traces.jsonl
          python scripts/generate_ops_report.py --eval-json reports/eval-report.json --traces-jsonl reports/traces.jsonl --markdown-report reports/ops-report.md --json-report reports/ops-report.json

      - name: Build FAQ persistent index
        run: python scripts/build_faq_index.py --corpus apps/citizen_faq_rag/corpus/sample_faq.md --output /tmp/citizen_faq_bm25.json --corpus-id sample_faq
      - name: Release readiness
        run: python scripts/release_readiness.py --release v0.7 --output reports/release-readiness.md --json-output reports/release-readiness.json
